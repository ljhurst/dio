---
name: CI

# yamllint disable-line rule:truthy
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ljhurst/stych/.github/actions/setup-toolchains@v1
        with:
          setup-uv: true

      - run: uv sync --locked

      - run: uv run pytest -q
