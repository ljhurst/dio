[project]
name = "dio"
version = "0.2.0"
description = "Wine label scanning service — vision extraction + enrichment for sommething"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Luke Hurst", email = "hurstlj@umich.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.125.0",
    "aws-lambda-powertools>=3.37.0",
    "aws-xray-sdk>=2.15.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "boto3>=1.43.118",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "evals"]

[tool.pytest.ini_options]
addopts = [
    "--cov=dio",
    "--cov-report=html",
    "--cov-report=term-missing",
]
